name: Bug report
description: Something OpenContextually selected, excluded, or flagged looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Nearly every bug in this project traces back to a specific repo +
        task string. The more of that you can share, the faster this gets
        fixed.
  - type: textarea
    id: task
    attributes:
      label: Task string
      description: The exact string you passed to `get_context()` / `octx`.
      placeholder: '"fix the authentication bug"'
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repo scanned
      description: Link if public, or a short description if private (language, rough shape).
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Primary language of the scanned repo
      placeholder: Python, TypeScript, Go, mixed, ...
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Repo size (ballpark)
      options:
        - "< 100 files"
        - "100-1,000 files"
        - "1,000-10,000 files"
        - "> 10,000 files"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste the relevant `octx` output (plain text or `--json`) if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: opencontextually version
      description: 'Run: octx --version'
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: 'Run: python --version'
    validations:
      required: true
