name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated here rather than inherited: a fork's pull request
# should never get a token that can write to this repository.
permissions:
  contents: read

# A contributor pushing three times in a minute should not queue three full
# matrices. Superseded runs on the same ref are cancelled; main is not,
# so its history keeps a result per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
