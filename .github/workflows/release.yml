name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets a maintainer run the exact same pipeline for a tag that already
  # exists (e.g. the very first PyPI publish, for a tag pushed before this
  # workflow did) without force-pushing or re-tagging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a release publishing to PyPI must never be
  # interrupted mid-upload.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - name: Verify the pushed tag matches the package version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      # --- bug fix: __version__ drifted from the published wheel's own
      # metadata (0.2.2 shipped with a hardcoded __version__ = "0.2.0") ---
      #
      # `pytest` in the `test` job above runs against an *editable* install
      # (`pip install -e .`), which reads version metadata from the source
      # checkout's own generated dist-info -- not from the wheel this job
      # is about to upload to PyPI. This step installs the actual built
      # artifact into a clean, fresh virtualenv (no editable install, no
      # source checkout on the path) and checks that its own runtime
      # metadata, its `__version__`, and its CLI's `--version` output all
      # agree -- the same three values a user runs after `pip install
      # opencontextually` would see, verified against the literal file
      # about to be published rather than a proxy for it.
      - name: Verify the built wheel's version end to end
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install --force-reinstall dist/*.whl

          PACKAGE_VERSION="$(/tmp/wheel-smoke-venv/bin/python -c "import importlib.metadata as m; print(m.version('opencontextually'))")"
          MODULE_VERSION="$(/tmp/wheel-smoke-venv/bin/python -c "import opencontextually; print(opencontextually.__version__)")"
          CLI_VERSION="$(/tmp/wheel-smoke-venv/bin/gctx --version | awk '{print $2}')"

          echo "package metadata: $PACKAGE_VERSION"
          echo "opencontextually.__version__: $MODULE_VERSION"
          echo "gctx --version: $CLI_VERSION"

          test "$PACKAGE_VERSION" = "$MODULE_VERSION"
          test "$PACKAGE_VERSION" = "$CLI_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opencontextually/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) -- no API token stored
      # in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    # softprops/action-gh-release needs a tag ref to attach to. A
    # workflow_dispatch run (used for one-off/manual publishes) has none --
    # only a tag push does.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute the PyPI version from the tag
        run: echo "PYPI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # `body` is pre-pended to the auto-generated notes, not replaced
          # by them -- see https://github.com/softprops/action-gh-release.
          body: |
            📦 [`opencontextually ${{ env.PYPI_VERSION }}` on PyPI](https://pypi.org/project/opencontextually/${{ env.PYPI_VERSION }}/) — `pip install opencontextually`
