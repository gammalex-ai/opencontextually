[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontextually"
version = "0.2.1"
description = "Give your AI agent the right context before it acts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GammaLex" }]
keywords = ["context", "ai", "agent", "llm", "code-search", "mcp", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "pathspec",
]

[project.urls]
Homepage = "https://github.com/gammalex-ai/opencontextually"
Repository = "https://github.com/gammalex-ai/opencontextually"
Issues = "https://github.com/gammalex-ai/opencontextually/issues"
Changelog = "https://github.com/gammalex-ai/opencontextually/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    # >=7.0 for the `pythonpath` ini option below, which is what makes a bare
    # `pytest` test *this* checkout rather than whatever an editable install
    # happens to have put on sys.path. See tests/conftest.py.
    "pytest>=7.0",
]
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
# `gctx` (GammaLex Context) is the primary command. `octx` is kept as a
# backwards-compatible alias for anyone who installed before the rename --
# removing it would break existing scripts for no benefit. `opencontextually`
# remains the spelled-out form. All three are the same entry point.
gctx = "opencontextually.cli:main"
octx = "opencontextually.cli:main"
opencontextually = "opencontextually.cli:main"
opencontextually-mcp = "opencontextually.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put this checkout's src/ at the front of sys.path for every test run.
#
# Without it, `pip install -e .` writes a .pth file pointing at whichever
# clone was installed, and that path wins over the repository you are
# actually sitting in. A developer in a git worktree could then run
# `pytest`, watch it pass, and have tested a different checkout entirely --
# a green suite that proves nothing about the code in front of them. That
# is a correctness problem with the test suite, not an environment quirk,
# so the fix lives in the repository rather than in a developer's shell.
pythonpath = ["src"]
