[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontextually"
version = "0.1.0.dev0"
description = "Give your AI agent the right context before it acts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pathspec",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
opencontextually = "opencontextually.cli:main"
octx = "opencontextually.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
